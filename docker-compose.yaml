services:
  speedtest:
    container_name: speedtest
    build: .
    image: docker-speedtest-analyser
    restart: unless-stopped
    network_mode: bridge
    volumes:
      - ~/Docker/speedtest/data:/var/www/html/data
    ports:
      - 8080:80
    environment:
      - CRONJOB_ITERATION=15
      - TZ=Europe/Zurich
